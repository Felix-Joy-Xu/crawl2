name: Phase2 Crawler (AI原生仓库 + 回溯2020)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run crawler
        env:
          GITHUB_TOKENS: ${{ secrets.GITHUB_TOKENS }}
        run: |
          echo "TOKEN_COUNT=$(echo $GITHUB_TOKENS | tr ',' '\n' | wc -l)"
          python crawler_phase2.py

      - name: Commit progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data_phase2 ]; then
            git add data_phase2/ 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "无变更"
            else
              git commit -m "Phase2 爬取进度 [skip ci]" && git push || echo "提交或推送跳过"
            fi
          else
            echo "data_phase2/ 目录不存在"
          fi
