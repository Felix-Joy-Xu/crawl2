name: Phase2 Crawler V2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        env:
          GITHUB_TOKENS: ${{ secrets.for_2 }}
        run: |
          # 每30分钟自动提交
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          (
            while true; do
              sleep 1800
              echo "=== 30分钟自动备份 ==="
              git add data_phase2/
              git commit -m "Phase2 auto [skip ci]" && git push || echo "无新数据"
            done
          ) &
          python crawler_v2.py

      - name: Final commit
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_phase2/
          git commit -m "Phase2 final [skip ci]" && git push || echo "无新数据"
