name: Phase2 Crawler (AI原生仓库 + 回溯2020)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run crawler
        env:
          GITHUB_TOKENS: ${{ secrets.GITHUB_TOKENS }}
        run: python crawler_phase2.py

      - name: Commit progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_phase2/
          git commit -m "Phase2 爬取进度 [skip ci]" || echo "无新数据"
          git push || echo "推送失败(重试)"
