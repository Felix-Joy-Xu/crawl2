name: Phase2 Crawler (AI原生仓库 + 回溯2020)

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试模式 (只爬 d3/d3)'
        type: boolean
        default: true
  schedule:
    - cron: "0 */6 * * *"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Quick commit test
        run: |
          mkdir -p data_phase2
          echo "test $(date)" > data_phase2/TEST.txt
          git config --global user.name "actions"
          git config --global user.email "actions@github.com"
          git add data_phase2/TEST.txt
          git commit -m "test: verify git push works" && git push && echo "=== COMMIT PUSH OK ===" || echo "=== COMMIT PUSH FAILED ==="

      - name: Run crawler
        env:
          GITHUB_TOKENS: ${{ secrets.for_2 }}
          TEST_MODE: ${{ inputs.test_mode == true && '1' || '' }}
        run: |
          ( while true; do sleep 1800; git add data_phase2/ 2>/dev/null; git commit -m "Phase2 [skip ci]" 2>/dev/null && git push 2>/dev/null || echo "[auto-backup] no new data"; done ) &
          python crawler_phase2.py
          kill %1 2>/dev/null || true

      - name: Commit final
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add data_phase2/ 2>/dev/null || true
          git commit -m "Phase2 final [skip ci]" 2>/dev/null && git push 2>/dev/null || echo "[final] nothing to commit"
